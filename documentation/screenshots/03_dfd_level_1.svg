<text x="70" y="1780" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">Level 1 opens the single process from Level 0 into the eleven processes inside it.</text>
<text x="70" y="1804" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">Processes 1, 5, 7, 8 and 11 are built in Stanley's five route files.</text>
<text x="70" y="1828" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">Process 4 runs MobileNet in the browser and sends only the 1024 numbers to the server.</text>
<text x="70" y="1852" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">D1 is the busiest store because almost every feature reads the paintings table.</text>
