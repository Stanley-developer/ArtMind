<text x="60" y="905" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">PK is a primary key, FK is a foreign key. 1 to N means one row here relates to many rows there.</text>
<text x="60" y="928" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">favourites and painting_tags are joining tables. Each carries a composite primary key made of its two foreign keys.</text>
