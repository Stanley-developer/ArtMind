<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
</marker>
</defs>
<rect width="1280" height="960" fill="#ffffff"/>
<text x="640" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1b1b1b" text-anchor="middle">AI Request Flow</text>
<text x="640" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#666" text-anchor="middle">Feature 4, recognising an uploaded painting</text>
<line x1="60" y1="92" x2="1220" y2="92" stroke="#ddd" stroke-width="1.5"/>
<rect x="110" y="120" width="240" height="48" rx="4" fill="#2f4f6f" stroke="#2f4f6f" stroke-width="2"/>
<text x="230" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">BROWSER</text>
<line x1="230" y1="168" x2="230" y2="860" stroke="#cfcfcf" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="520" y="120" width="240" height="48" rx="4" fill="#2f4f6f" stroke="#2f4f6f" stroke-width="2"/>
<text x="640" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">SERVER</text>
<line x1="640" y1="168" x2="640" y2="860" stroke="#cfcfcf" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="930" y="120" width="240" height="48" rx="4" fill="#2f4f6f" stroke="#2f4f6f" stroke-width="2"/>
<text x="1050" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">DATABASE</text>
<line x1="1050" y1="168" x2="1050" y2="860" stroke="#cfcfcf" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="105" y="210" width="250" height="50" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="230" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">User picks a photo</text>
<line x1="230" y1="260" x2="230" y2="296" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="105" y="296" width="250" height="66" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="230" y="320.25" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Show it in an img element</text>
<text x="230" y="337.75" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">on the page</text>
<line x1="230" y1="362" x2="230" y2="398" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="105" y="398" width="250" height="72" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="230" y="425.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">mobilenet.infer(img, true)</text>
<text x="230" y="442.4375" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">stops one layer early</text>
<line x1="230" y1="470" x2="230" y2="506" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="105" y="506" width="250" height="50" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="230" y="531" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">1024 numbers</text>
<line x1="355" y1="540" x2="522" y2="540" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<text x="439" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1f6f54" font-weight="600" text-anchor="middle">POST /api/recognise</text>
<text x="439" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a4a4a" text-anchor="middle">{ embedding: [ ... ] }</text>
<rect x="515" y="210" width="250" height="66" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="640" y="234.25" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Load every stored</text>
<text x="640" y="251.75" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">embedding</text>
<line x1="765" y1="243" x2="925" y2="243" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="925" y1="290" x2="765" y2="290" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<text x="845" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a4a4a" text-anchor="middle">1024 numbers per painting</text>
<rect x="925" y="210" width="250" height="66" fill="#eef4f8" stroke="#2f4f6f" stroke-width="2"/>
<line x1="979" y1="210" x2="979" y2="276" stroke="#2f4f6f" stroke-width="2"/>
<text x="952" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2f4f6f" font-weight="700" text-anchor="middle" dominant-baseline="central">D1</text>
<text x="1077" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">paintings.embedding</text>
<rect x="515" y="600" width="250" height="72" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="640" y="627.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Cosine similarity against</text>
<text x="640" y="644.4375" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">each painting</text>
<line x1="640" y1="672" x2="640" y2="708" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="515" y="708" width="250" height="72" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="640" y="735.5625" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Sort, take top 6, k</text>
<text x="640" y="752.4375" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">nearest neighbour on top 5</text>
<line x1="515" y1="818" x2="350" y2="818" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<text x="439" y="796" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f6f54" font-weight="600" text-anchor="middle">{ category, confidence, similar }</text>
<polyline points="640,780 640,818" fill="none" stroke="#4a4a4a" stroke-width="2"/>
<rect x="105" y="782" width="250" height="50" rx="6" fill="#ffffff" stroke="#2f4f6f" stroke-width="2"/>
<text x="230" y="807" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Show the result</text>
<text x="60" y="900" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333" font-weight="600">The point to make: the neural network runs in the BROWSER. The server only does arithmetic.</text>
<text x="60" y="922" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">That is why nothing heavy has to be installed on the server, and why we send 1024 numbers instead of a photograph.</text>
<text x="640" y="938" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">ArtMind - Aptech eProject - github.com/Stanley-developer/ArtMind</text>
</svg>