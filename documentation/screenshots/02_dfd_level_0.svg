<line x1="1010" y1="556" x2="790" y2="395" stroke="#4a4a4a" stroke-width="2" marker-end="url(#ah)"/>
<text x="90" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">Level 0 shows the whole system as ONE process, and who talks to it.</text>
<text x="90" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#555">Squares are external entities. The circle is the process. The open box is a data store.</text>
<text x="590" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">ArtMind - Aptech eProject - github.com/Stanley-developer/ArtMind</text>
